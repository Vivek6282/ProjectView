services:
  - type: web
    name: projectview
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --pythonpath . projectview.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false # TiDB Cloud connection string
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MEDIA_ROOT
        sync: false
